server.port=8082

# ─── IBM MQ ────────────────────────────────────────────────────────────────
mq.host=localhost
mq.port=1414
mq.channel=SYSTEM.DEF.SVRCONN
mq.queueManager=MY.TEST.QMNGR

# ─── AWS S3 / LocalStack ────────────────────────────────────────────────────
# Set aws.localstack.enabled=true for local development (points to localhost:4566).
# Set to false (or remove) in production — S3Client will use the default AWS credential chain.
aws.localstack.enabled=true
aws.localstack.endpoint=http://localhost:4566
aws.region=us-east-1
# LocalStack accepts any non-blank key/secret — these are never sent to real AWS.
aws.accessKeyId=test
aws.secretAccessKey=test
# S3 bucket that holds incoming payment XML files.
# paymentFilePath values are bucket-relative keys — no s3:// prefix expected.
aws.s3.bucket=fwb-payments-dev
